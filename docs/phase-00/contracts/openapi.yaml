          enum: [en, id]
      oneOf:
        - required: [job_id]
          properties:
            job_id:
              type: string
        - required: [url]
          properties:
            url:
              type: string
              format: uri

    AnalysisRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [profile_changed, job_changed, user_requested, outdated]
        profile_version_id:
          type: string
        note:
          type: string
          maxLength: 2000

    GenerateDocumentsRequest:
      type: object
      additionalProperties: false
      required: [kinds, language]
      properties:
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/DocumentKind'
          minItems: 1
          maxItems: 2
        language:
          type: string
          enum: [en, id]
        template_version:
          type: string

    DocumentEdit:
      type: object
      required: [path, value]
      properties:
        path:
          type: string
          maxLength: 300
        value: {}
        note:
          type: string
          maxLength: 2000

    DocumentRevisionRequest:
      type: object
      additionalProperties: false
      required: [base_content_hash, edits]
      properties:
        base_content_hash:
          type: string
        edits:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/DocumentEdit'
        note:
          type: string
          maxLength: 2000

    Finding:
      type: object
      required: [finding_id, severity, category, quote, problem]
      properties:
        finding_id:
          type: string
        severity:
          type: string
          enum: [blocker, major, minor, nit]
        category:
          type: string
          enum: [factuality, relevance, exaggeration, language, ats, consistency, format, priority, eligibility]
        location:
          type: object
          properties:
            doc:
              type: string
              enum: [cv, cover_letter]
            section:
              type: [string, 'null']
            bullet_id:
              type: [string, 'null']
        quote:
          type: string
          maxLength: 2000
        problem:
          type: string
          maxLength: 2000
        evidence_refs:
          type: array
          maxItems: 100
          items:
            type: string
        suggested_fix:
          type: [string, 'null']
          maxLength: 2000
        auto_fixable:
          type: boolean
        status:
          type: string
          enum: [open, resolved, accepted]

    FindingsReport:
      type: object
      required: [document_version_id, profile_version_id, verdict, findings]
      properties:
        document_version_id:
          type: string
        profile_version_id:
          type: string
        review_run_id:
          type: [string, 'null']
        cycle:
          type: [integer, 'null']
          minimum: 1
          maximum: 3
        verdict:
          type: string
          enum: [pass, changes_required, unresolved, review_unavailable]
        findings:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Finding'
        reviewed_at:
          type: [string, 'null']
          format: date-time

    ApprovalDecision:
      type: string
      enum: [approved, rejected, changes_requested]

    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision, content_hash]
      properties:
        decision:
          $ref: '#/components/schemas/ApprovalDecision'
        content_hash:
          type: string
          description: Harus sama dengan `content_hash` versi yang disetujui.
        note:
          type: string
          maxLength: 2000

    ApprovalRecord:
      type: object
      required: [approval_id, document_version_id, profile_version_id, document_hash, kind, decision, decided_at]
      properties:
        approval_id:
          type: string
        document_version_id:
          type: string
        profile_version_id:
          type: string
          description: Versi profil yang dipakai oleh versi dokumen yang disetujui.
        document_hash:
          type: string
        kind:
          $ref: '#/components/schemas/DocumentKind'
        decision:
          $ref: '#/components/schemas/ApprovalDecision'
        note:
          type: [string, 'null']
          maxLength: 2000
        decided_at:
          type: string
          format: date-time
        decided_by:
          type: string
          enum: [user]

    ExportRequest:
      type: object
      additionalProperties: false
      required: [kind, document_version_id, content_hash]
      properties:
        kind:
          $ref: '#/components/schemas/DocumentKind'
        document_version_id:
          type: string
        content_hash:
          type: string
        filename:
          type: string
          maxLength: 255
          description: Opsional. Backend tetap menyanitasi dan dapat memakai suffix stabil.

    ExportRecord:
      type: object
      required: [export_id, document_version_id, profile_version_id, document_hash, kind, filename, status, created_at]
      properties:
        export_id:
          type: string
        document_version_id:
          type: string
        profile_version_id:
          type: string
          description: Versi profil yang dipakai oleh versi dokumen yang diekspor.
        document_hash:
          type: string
        kind:
          $ref: '#/components/schemas/DocumentKind'
        filename:
          type: string
          maxLength: 255
          description: |
            Nama final yang dihitung backend. Untuk `tex_only`/`failed`, nama
            merujuk artefak yang benar-benar ada (`.tex`) atau tetap nama target.
        exported_at:
          type: [string, 'null']
          format: date-time
          description: |
            Null kecuali `status: exported`. Diisi hanya setelah PDF berhasil dibuat
            dan export record ditulis.
        created_at:
          type: string
          format: date-time
          description: Waktu export record dibuat, terlepas dari hasil compile.
        status:
          type: string
          description: |
            `exported`: PDF berhasil dan file final tercatat. `tex_only`: sumber
            LaTeX tersimpan tetapi PDF tidak dihasilkan. `failed`: tidak ada
            artefak final yang dapat diunduh. Mesin PDF tidak ditetapkan kontrak
            (D6 OPEN).
          enum: [exported, tex_only, failed]
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: 'null'
          description: Kode aman untuk `tex_only`/`failed`, misalnya `compile_failed`.
        download_url:
          type: [string, 'null']
          description: |
            Path API relatif, hanya terisi bila `status: exported`. Tidak memuat
            path filesystem.

    ExportList:
      type: object
      required: [application_id, items, page]
      properties:
        application_id:
          type: string
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ExportRecord'
        page:
          $ref: '#/components/schemas/PageInfo'

    ProviderRoleConfig:
      type: object
      required: [model]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 200
        temperature:
          type: number
          minimum: 0
          maximum: 2

    ProviderSettings:
      type: object
      required: [provider_id, configured, roles, key_source]
      properties:
        provider_id:
          type: [string, 'null']
          description: Identifier konfigurasi, bukan vendor yang diasumsikan.
        display_name:
          type: [string, 'null']
        configured:
          type: boolean
        base_url:
          type: [string, 'null']
          description: Opsional. Tanpa kredensial di URL.
        roles:
          type: object
          properties:
            extract:
              $ref: '#/components/schemas/ProviderRoleConfig'
            classify:
              $ref: '#/components/schemas/ProviderRoleConfig'
            write:
              $ref: '#/components/schemas/ProviderRoleConfig'
            review:
              $ref: '#/components/schemas/ProviderRoleConfig'
        key_source:
          type: string
          enum: [keyring, env, missing]
        consent_renewal_required:
          type: boolean
        updated_at:
          type: [string, 'null']
          format: date-time

    ProviderUpdateRequest:
      type: object
      additionalProperties: false
      required: [provider_id, roles]
      properties:
        provider_id:
          type: string
          minLength: 1
          maxLength: 100
        display_name:
          type: string
          maxLength: 200
        base_url:
          type: string
          format: uri
        roles:
          type: object
          required: [extract, classify, write, review]
          properties:
            extract:
              $ref: '#/components/schemas/ProviderRoleConfig'
            classify:
              $ref: '#/components/schemas/ProviderRoleConfig'
            write:
              $ref: '#/components/schemas/ProviderRoleConfig'
            review:
              $ref: '#/components/schemas/ProviderRoleConfig'
        api_key_ref:
          type: string
          maxLength: 200
          description: Nama referensi keyring. API tidak menerima nilai secret.

    ConsentType:
      type: string
      enum: [cloud_data_processing]

    ConsentScope:
      type: object
      description: |
        Cakupan consent. Consent lama tetap berlaku hanya bila `provider_id`,
        `data_classes`, dan model per role sama dengan konfigurasi aktif. Perubahan
        model pada role mana pun (`extract`, `classify`, `write`, `review`)
        memerlukan consent baru. Perubahan role yang tidak terpakai untuk
        pengiriman data kandidat tidak memperluas cakupan consent.
      required: [data_classes, provider_id]
      properties:
        data_classes:
          type: array
          maxItems: 3
          items:
            type: string
            enum: [cv_text, job_description, profile_slice]
        provider_id:
          type: string
        model_roles:
          type: object
          description: |
            Model per role yang tercatat saat consent diberikan. Diisi server dari
            konfigurasi aktif; klien tidak perlu mengirimnya.
          additionalProperties: false
          properties:
            extract:
              type: string
              maxLength: 200
            classify:
              type: string
              maxLength: 200
            write:
              type: string
              maxLength: 200
            review:
              type: string
              maxLength: 200

    ConsentRecord:
      type: object
      required: [consent_id, consent_type, scope, text_version, granted_at]
      properties:
        consent_id:
          type: string
        consent_type:
          $ref: '#/components/schemas/ConsentType'
        scope:
          $ref: '#/components/schemas/ConsentScope'
        text_version:
          type: string
          maxLength: 100
        granted_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time

    ConsentStatus:
      type: object
      required: [required, granted, history, history_truncated]
      properties:
        required:
          type: boolean
        granted:
          type: boolean
        current:
          oneOf:
            - $ref: '#/components/schemas/ConsentRecord'
            - type: 'null'
        provider_changed_since_consent:
          type: boolean
        model_changed_since_consent:
          type: boolean
          description: |
            True bila provider atau model pada salah satu role berbeda dari yang
            tercatat pada consent berlaku. Consent lama tidak berlaku dan consent
            baru diperlukan.
        required_scope:
          oneOf:
            - $ref: '#/components/schemas/ConsentScope'
            - type: 'null'
        required_text:
          $ref: '#/components/schemas/ConsentText'
        history:
          type: array
          description: |
            Maksimum `history_limit` record terbaru, urut terbaru lebih dulu.
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConsentRecord'
        history_truncated:
          type: boolean
          description: True bila masih ada record riwayat lebih lama yang tidak dikirim.

    ConsentText:
      type: object
      description: |
        Teks consent versi server. Klien menampilkan `display_text` dan tidak
        memilih `text_version`; server menetapkan versi saat consent dicatat.
      required: [text_version, text_sha256, display_text, issued_at]
      properties:
        text_version:
          type: string
          maxLength: 100
          description: Diterbitkan server. Read-only bagi klien.
        text_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Hash teks consent untuk audit.
        display_text:
          type: string
          maxLength: 8000
        issued_at:
          type: string
          format: date-time

    ConsentCreateRequest:
      type: object
      description: |
        `text_version` tidak diterima dari klien. Server menetapkan versi teks
        consent aktif saat request dicatat.
      additionalProperties: false
      required: [consent_type, scope, accepted]
      properties:
        consent_type:
          $ref: '#/components/schemas/ConsentType'
        scope:
          $ref: '#/components/schemas/ConsentScope'
        accepted:
          type: boolean
          enum: [true]

    RetentionItem:
      type: object
      required: [data_class, status]
      properties:
        data_class:
          type: string
        duration_days:
          type: [integer, 'null']
          minimum: 0
        status:
          type: string
          enum: [provisional]

    RetentionInfo:
      type: object
      required: [provisional, items]
      properties:
        provisional:
          type: boolean
          enum: [true]
        items:
          type: array
          items:
            $ref: '#/components/schemas/RetentionItem'

    ToolchainInfo:
      type: object
      description: |
        Status mesin PDF. D6 OPEN: kontrak tidak menetapkan mesin PDF tertentu dan
        tidak menjamin satu mesin tersedia. `pdf_engine` melaporkan konfigurasi
        runtime, bukan keputusan produk.
      required: [pdf_engine, status, decision_status]
      properties:
        pdf_engine:
          type: [string, 'null']
          maxLength: 100
          description: |
            Identifier mesin PDF yang dikonfigurasi saat runtime, misalnya nama
            executable. Null bila belum dikonfigurasi.
        status:
          type: string
          enum: [available, unavailable, unknown]
        decision_status:
          type: string
          description: Status keputusan D6. Selama OPEN, ekspor PDF tidak dijanjikan.
          enum: [open, decided]
        detail:
          type: [string, 'null']
          maxLength: 500

    Settings:
      type: object
      required: [app, provider, consent, preferences, retention, toolchain]
      properties:
        app:
          type: object
          required: [version, api_version, schema_version]
          properties:
            version:
              type: string
            api_version:
              type: string
            schema_version:
              type: string
        provider:
          $ref: '#/components/schemas/ProviderSettings'
        consent:
          $ref: '#/components/schemas/ConsentStatus'
        preferences:
          $ref: '#/components/schemas/SearchPreferences'
        retention:
          $ref: '#/components/schemas/RetentionInfo'
        toolchain:
          $ref: '#/components/schemas/ToolchainInfo'

    ActivityEvent:
      type: object
      required: [event_id, occurred_at, workflow, status_context, summary]
      properties:
        event_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        workflow:
          type: string
          enum: [setup, discovery, apply, export, settings]
        stage:
          type: [string, 'null']
        status_context:
          $ref: '#/components/schemas/ActivityStatusContext'
        summary:
          type: string
          maxLength: 300
          description: Metadata aman. Tanpa isi dokumen dan tanpa PII.
        application_id:
          type: [string, 'null']
        job_id:
          type: [string, 'null']
        task_id:
          type: [string, 'null']

    ActivityStatusContext:
      type: object
      description: |
        Status aktivitas dengan konteks bertipe. `value` harus berasal dari kosakata
        `kind` yang sesuai; konteks tidak boleh dicampur.
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [task, document, application, eligibility, review, export, master_cv, profile, source_progress]
        value:
          type: string
          enum:
            - not_started
            - queued
            - processing
            - needs_review
            - completed
            - partial
            - failed
            - skipped
            - draft
            - in_review
            - approved
            - exported
            - outdated
            - unavailable
            - uploaded
            - extracted
            - confirmed
            - superseded
            - eligible
            - ineligible
            - pass
            - changes_required
            - unresolved
            - tex_only

    ActivityList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ActivityEvent'
        page:
          $ref: '#/components/schemas/PageInfo'

    OverviewCounts:
      type: object
      required: [eligible, needs_review, ineligible, total_jobs, documents_pending_review]
      properties:
        eligible:
          type: integer
          minimum: 0
        needs_review:
          type: integer
          minimum: 0
        ineligible:
          type: integer
          minimum: 0
        total_jobs:
          type: integer
          minimum: 0
        documents_pending_review:
          type: integer
          minimum: 0

    Overview:
      type: object
      required: [counts, next_action, consent_required, provider_configured, recent_activity]
      properties:
        master_cv:
          oneOf:
            - $ref: '#/components/schemas/MasterCv'
            - type: 'null'
        profile:
          oneOf:
            - $ref: '#/components/schemas/ProfileSummary'
            - type: 'null'
        discovery:
          oneOf:
            - $ref: '#/components/schemas/DiscoveryRun'
            - type: 'null'
        counts:
          $ref: '#/components/schemas/OverviewCounts'
        next_action:
          $ref: '#/components/schemas/NextAction'
        consent_required:
          type: boolean
        provider_configured:
          type: boolean
        active_task_id:
          type: [string, 'null']
          description: |
            Task yang sedang berjalan, bila ada. UI memulihkan progress setelah
            reload dengan polling `GET /api/tasks/{task_id}`.
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/ActivityEvent'
          maxItems: 10
