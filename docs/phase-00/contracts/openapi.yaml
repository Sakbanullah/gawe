        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ApplicationSummary'
        page:
          $ref: '#/components/schemas/PageInfo'

    ApplicationCreated:
      type: object
      required: [application_id, job_id, deduplicated]
