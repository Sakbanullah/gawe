      properties:
        document_version_id:
          type: string
        application_id:
          type: string
        profile_version_id:
          type: string
          description: Versi profil yang dipakai saat versi dokumen ini dibuat.
        job_posting_version_id:
          type: string
        kind:
          $ref: '#/components/schemas/DocumentKind'
        version:
