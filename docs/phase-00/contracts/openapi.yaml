        fit_score:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        document_counts:
          type: object
          properties:
            cv_versions:
              type: integer
              minimum: 0
            cover_letter_versions:
              type: integer
              minimum: 0
            pending_review:
