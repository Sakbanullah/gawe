            type: string
        prompt_version:
          type: [string, 'null']
        template_version:
          type: [string, 'null']
        provider:
          type: [string, 'null']
          description: Nama provider konfigurasi, bukan secret.
        model:
          type: [string, 'null']
        review_status:
          $ref: '#/components/schemas/ReviewStatus'
        approved:
          type: boolean
        approval_id:
          type: [string, 'null']
        exported:
          type: boolean
        export_id:
          type: [string, 'null']
        pdf_available:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DocumentList:
      type: object
      required: [application_id, items, page]
      properties:
        application_id:
