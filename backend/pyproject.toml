[project]
name = "gawe"
version = "0.1.0"
description = "Gawe — aplikasi web lokal untuk Master CV sampai lamaran siap ekspor."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "jsonschema==4.26.0",
    "keyring==25.7.0",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "pymysql==1.1.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
]

[project.scripts]
gawe = "gawe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gawe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: opt-in provider test; skipped unless GAWE_LIVE_9ROUTER=1",
]
